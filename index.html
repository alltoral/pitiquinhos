<script>
window.storage = {
  get: async function (key, shared) {
    var raw = localStorage.getItem(key);
    if (raw === null) throw new Error("Key not found: " + key);
    return { key: key, value: raw, shared: !!shared };
  },
  set: async function (key, value, shared) {
    localStorage.setItem(key, value);
    return { key: key, value: value, shared: !!shared };
  },
  delete: async function (key, shared) {
    localStorage.removeItem(key);
    return { key: key, deleted: true, shared: !!shared };
  },
  list: async function (prefix, shared) {
    var p = prefix || "";
    var keys = Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; });
    return { keys: keys, prefix: prefix, shared: !!shared };
  }
};

if ("serviceWorker" in navigator) {
  var swRefreshed = false;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (swRefreshed) return;
    swRefreshed = true;
    window.location.reload();
  });
  window.addEventListener("load", function () {
    navigator.serviceWorker
      .register("sw.js", { updateViaCache: "none" })
      .then(function (reg) {
        // Actively ask the browser to check for a newer sw.js right away,
        // instead of waiting for its own internal update timer.
        reg.update().catch(function () {});
      })
      .catch(function (err) {
        console.warn("Service worker registration failed:", err);
      });
  });
}
</script>

// ---------- Helpers ----------
const todayKey = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(
    d.getDate()
  ).padStart(2, "0")}`;
};

const formatTime = (iso) =>
  new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

const formatDayLabel = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  const label = date.toLocaleDateString("pt-BR", {
    weekday: "long",
    day: "2-digit",
    month: "long",
  });
  return label.charAt(0).toUpperCase() + label.slice(1);
};

const formatShortDate = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return `${String(d).padStart(2, "0")}/${String(m).padStart(2, "0")}`;
};

const formatDayMonthAbbrev = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  const date = new Date(y, m - 1, d);
  return date.toLocaleDateString("pt-BR", { day: "numeric", month: "short" });
};

const WeekBarChart = ({ data }) => {
  const width = 300;
  const height = 130;
  const padBottom = 22;
  const padTop = 8;
  const chartH = height - padBottom - padTop;
  const max = Math.max(1, ...data.flatMap((d) => [d.walks, d.poops]));
  const groupW = width / data.length;
  const barW = Math.min(16, groupW / 3);

  return (
    <svg
      className="week-chart"
      viewBox={`0 0 ${width} ${height}`}
      width="100%"
      height={height}
      preserveAspectRatio="xMidYMid meet"
    >
      <line x1="0" y1={height - padBottom} x2={width} y2={height - padBottom} stroke="var(--ink)" strokeWidth="1.5" />
      {data.map((d, i) => {
        const cx = i * groupW + groupW / 2;
        const walkH = (d.walks / max) * chartH;
        const poopH = (d.poops / max) * chartH;
        return (
          <g key={i}>
            <rect
              x={cx - barW - 2}
              y={height - padBottom - walkH}
              width={barW}
              height={walkH}
              fill="var(--ink)"
              rx="2"
            />
            <rect
              x={cx + 2}
              y={height - padBottom - poopH}
              width={barW}
              height={poopH}
              fill="var(--paper)"
              stroke="var(--ink)"
              strokeWidth="1.5"
              rx="2"
            />
            <text
              x={cx}
              y={height - 6}
              textAnchor="middle"
              fontSize="10"
              fontFamily="Quicksand, sans-serif"
              fontWeight="700"
              fill="var(--muted)"
            >
              {d.label}
            </text>
          </g>
        );
      })}
    </svg>
  );
};

function DogTracker() {

  const loadDay = useCallback(async (k) => {

  const saveDates = useCallback(async (list) => {

  const savePurchases = useCallback(async (list) => {

    } catch (e) {
      console.error("Falha ao salvar compras de ração", e);
    }
  }, []);

  useEffect(() => {
    (async () => {
      setLoading(true);
      let list = [];
      try {
        const d = await window.storage.get("log:dates");
        list = d ? JSON.parse(d.value) : [];
      } catch {

      if (!list.includes(key)) {

      setDates(list);
      const todayData = await loadDay(key);
      setDay(todayData);
      setSelectedDateKey(key);

      const histEntries = {};
      for (const k of list.filter((d) => d !== key).slice(0, 60)) {

      setHistory(histEntries);

      try {
        const p = await window.storage.get("food:purchases");

      } catch {

      try {
        const cd = await window.storage.get(`cat:log:${key}`);
        setCatDay(cd ? { ...emptyCatDay(), ...JSON.parse(cd.value) } : emptyCatDay());
      } catch {
        setCatDay(emptyCatDay());
      }

      // Load the current week's cat days (Mon-Sun) for the Resumão stats card
      try {
        const today = new Date();
        const dow = (today.getDay() + 6) % 7; // Monday = 0
        const monday = new Date(today);
        monday.setDate(today.getDate() - dow);
        const weekKeys = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(monday);

            `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`

        }
        const entries = {};
        for (const k of weekKeys.filter((k) => k !== key)) {
          try {
            const cd = await window.storage.get(`cat:log:${k}`);
            entries[k] = cd ? { ...emptyCatDay(), ...JSON.parse(cd.value) } : emptyCatDay();
          } catch {

      try {

        setCatPurchases(cp ? JSON.parse(cp.value) : []);
      } catch {

    })();
  }, []); // eslint-disable-line

  const update = (mutator) => {

  const addWalk = () => {

  const removeWalk = (i) =>

  const setPeeYes = () =>
    update((d) => ({
      ...d,
      peeStatus: true,

  const setPeeNo = () => update((d) => ({ ...d, peeStatus: false, peeTimes: [] }));

  const addPoop = () =>
    update((d) => ({ ...d, poops: [...d.poops, new Date().toISOString()] }));

  const addFeeding = () => {

  const removePurchase = (id) => {

  const setAteAll = (val) => update((d) => ({ ...d, ateAll: d.ateAll === val ? null : val }));
  const setVomited = (val) => update((d) => ({ ...d, vomited: d.vomited === val ? null : val }));
  const setMood = (id) => {

  // ---------- Cat (Caderneta felina) ----------
  const saveCatDay = useCallback(
    async (data) => {
      try {
        await window.storage.set(`cat:log:${key}`, JSON.stringify(data));
      } catch (e) {

    [key]

  const catUpdate = (mutator) => {

  const addLitterChange = () => {

    setShowLitterSticker(true);
    window.clearTimeout(addLitterChange._t);

  const removeLitterChange = (i) =>

  const addCatFeeding = () =>
    catUpdate((d) => ({
      ...d,
      feedings: [...d.feedings, { time: new Date().toISOString(), id: Math.random().toString(36).slice(2) }],
    }));

  const removeCatFeeding = (id) =>
    catUpdate((d) => ({ ...d, feedings: d.feedings.filter((f) => f.id !== id) }));

  const setCatAteAll = (val) => catUpdate((d) => ({ ...d, ateAll: d.ateAll === val ? null : val }));
  const setCatVomited = (val) => catUpdate((d) => ({ ...d, vomited: d.vomited === val ? null : val }));

  const setCatMood = (id) => {

  const saveCatPurchases = async (list) => {

  const addCatPurchase = () => {

  const removeCatPurchase = (id) => {
    setCatPurchases((prev) => {
      const next = prev.filter((p) => p.id !== id);
      saveCatPurchases(next);
      return next;
    });
  };

  // ---------- Backup: export / import all app data ----------
  const exportBackup = async () => {
    try {
      const { keys } = await window.storage.list("");
      const data = {};
      for (const k of keys) {
        try {
          const res = await window.storage.get(k);
          if (res) data[k] = res.value;
        } catch {
          /* skip unreadable key */

      }
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });

  const importBackupFile = (file) => {

        const data = JSON.parse(reader.result);

  if (loading) {

  // ---------- Calendar & weekly-stats helpers ----------
  const getDayData = (k) => (k === key ? day : history[k] || null);
  const dayHasData = (k) => {
    const d = getDayData(k);
    if (!d) return false;
    return (
      d.walks.length > 0 ||
      d.peeStatus !== null ||
      d.poops.length > 0 ||
      d.feedings.length > 0 ||
      d.ateAll !== null ||
      d.vomited !== null ||
      d.mood !== null
    );
  };

  const daysBetween = (a, b) => {
    const [ay, am, ad] = a.split("-").map(Number);
    const [by, bm, bd] = b.split("-").map(Number);
    const da = new Date(ay, am - 1, ad);
    const db = new Date(by, bm - 1, bd);
    return Math.round((db - da) / (1000 * 60 * 60 * 24));

  const getPurchaseForDate = (k) => purchases.find((p) => p.date === k) || null;

  const sortedPurchases = [...purchases].sort((a, b) => a.date.localeCompare(b.date));
  const lastPurchase = sortedPurchases[sortedPurchases.length - 1] || null;

  const avgDailyConsumption = (() => {
    if (sortedPurchases.length < 2) return null;
    let totalKg = 0;
    let totalDays = 0;
    for (let i = 0; i < sortedPurchases.length - 1; i++) {
      const days = daysBetween(sortedPurchases[i].date, sortedPurchases[i + 1].date);
      if (days > 0) {
        totalKg += sortedPurchases[i].amount;
        totalDays += days;
      }
    }
    return totalDays > 0 ? totalKg / totalDays : null;
  })();

  const racaoEstimate = (() => {
    if (!lastPurchase) return null;
    if (!avgDailyConsumption) return { durationDays: null, remainingDays: null };
    const durationDays = lastPurchase.amount / avgDailyConsumption;
    const elapsed = daysBetween(lastPurchase.date, key);
    const remainingDays = Math.round(durationDays - elapsed);
    return { durationDays: Math.round(durationDays), remainingDays };
  })();

  const computeStockInfo = (list, type) => {
    const filtered = list.filter((p) => (p.type || "racao") === type).sort((a, b) => a.date.localeCompare(b.date));
    const last = filtered[filtered.length - 1] || null;
    let avg = null;
    if (filtered.length >= 2) {
      let totalKg = 0;
      let totalDays = 0;
      for (let i = 0; i < filtered.length - 1; i++) {
        const days = daysBetween(filtered[i].date, filtered[i + 1].date);
        if (days > 0) {
          totalKg += filtered[i].amount;
          totalDays += days;
        }
      }
      avg = totalDays > 0 ? totalKg / totalDays : null;
    }
    let estimate = null;
    if (last) {
      if (!avg) {
        estimate = { durationDays: null, remainingDays: null };
      } else {
        const durationDays = last.amount / avg;
        const elapsed = daysBetween(last.date, key);
        estimate = { durationDays: Math.round(durationDays), remainingDays: Math.round(durationDays - elapsed) };
      }
    }
    return { sorted: filtered, last, avg, estimate };
  };

  const WEEKDAY_LABELS = ["Seg", "Ter", "Qua", "Qui", "Sex", "Sáb", "Dom"];

  const getMonthMatrix = (offset) => {
    const base = new Date();
    const year = base.getFullYear();
    const month = base.getMonth() + offset;
    const first = new Date(year, month, 1);
    const startDay = (first.getDay() + 6) % 7; // Monday = 0
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDay; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) {
      const date = new Date(year, month, d);
      cells.push({
        dateKey: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, "0")}-${String(
          date.getDate()
        ).padStart(2, "0")}`,
        day: d,
      });
    }
    while (cells.length % 7 !== 0) cells.push(null);
    return { cells, monthDate: first };
  };

  const { cells: calendarCells, monthDate } = getMonthMatrix(calendarMonthOffset);
  const monthLabel = (() => {
    const label = monthDate.toLocaleDateString("pt-BR", { month: "long", year: "numeric" });
    return label.charAt(0).toUpperCase() + label.slice(1);
  })();

  const getCurrentWeekDates = () => {
    const today = new Date();
    const dow = (today.getDay() + 6) % 7; // Monday = 0
    const monday = new Date(today);
    monday.setDate(today.getDate() - dow);
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday);
      d.setDate(monday.getDate() + i);
      out.push(
        `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`
      );
    }
    return out;

                    <div className="racao-summary">
                      <p className="muted small">
                        Última compra: {formatShortDate(info.last.date)} · {info.last.amount} kg
                      </p>
                      {info.estimate?.durationDays ? (
                        <p className="muted small">
                          Consumo médio estimado: dura ~{info.estimate.durationDays} dias
                          {info.estimate.remainingDays !== null && (
                            <>
                              {" "}
                              ·{" "}
                              {info.estimate.remainingDays >= 0
                                ? `restam ~${info.estimate.remainingDays} dias`
                                : "já deveria ter acabado, hora de comprar mais!"}
                            </>
                          )}
                        </p>
                      ) : (
                        <p className="muted small">
                          Registre a próxima compra pra eu calcular quanto costuma durar.
                        </p>
                      )}
                    </div>
                  );
                })()}

                {(() => {
                  const list = catPurchases
                    .filter((p) => (p.type || "racao") === catStockType)
                    .sort((a, b) => a.date.localeCompare(b.date))
                    .slice(-4)
                    .reverse();
                  if (list.length === 0) return null;
                  return (
                    <ul className="chip-list">
                      {list.map((p) => (
                        <li key={p.id} className="chip">
                          {catStockType === "racao" ? <FoodBag size={13} /> : <LitterIcon size={13} />}
                          {formatShortDate(p.date)} · {p.amount}kg
                          <button className="chip-x" onClick={() => removeCatPurchase(p.id)} aria-label="Remover">
                            ×
                          </button>
                        </li>
                      ))}
                    </ul>
                  );
                })()}
              </>
            ) : (
              <button className="racao-tag" onClick={() => setCatStockOpen(true)}>
                <FoodBag size={16} />
                <span className="racao-tag-title">
                  {(() => {
                    const r = computeStockInfo(catPurchases, "racao");
                    const a = computeStockInfo(catPurchases, "areia");
                    const parts = [];
                    if (r.last) parts.push(`Ração: ${r.last.amount}kg`);
                    if (a.last) parts.push(`Areia: ${a.last.amount}kg`);
                    return parts.length ? parts.join(" · ") : "Nenhuma compra registrada";
                  })()}
                </span>
              </button>
            )}
          </section>
        </main>
      )}

      <div className="backup-row">
        <button className="backup-link" onClick={exportBackup}>
          Baixar backup
        </button>
        <span className="backup-sep">·</span>
        <label className="backup-link backup-import-label">
          Importar backup
          <input
            type="file"
            accept="application/json"
            className="backup-file-input"
            onChange={(e) => {
              const file = e.target.files && e.target.files[0];
              if (file) importBackupFile(file);
              e.target.value = "";
            }}
          />
        </label>
        {backupMessage && (
          <span className={`backup-message ${backupMessage.type === "error" ? "is-error" : ""}`}>
            {backupMessage.text}
          </span>
        )}
      </div>

      <footer className="dt-footer">
        <Bone size={16} /> feito com carinho para seu melhor amigo
      </footer>
    </div>
  );
}

.legend-walks { background: var(--ink); }
.legend-poops { background: var(--paper); }

.backup-row {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 18px;
  margin-top: -4px;
}
.backup-link {
  background: none;
  border: none;
  padding: 2px;
  font-family: 'Quicksand', sans-serif;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--muted);
  text-decoration: underline;
  cursor: pointer;
}
.backup-sep { font-size: 10px; color: var(--muted); }
.backup-import-label {
  position: relative;
  display: inline-block;
  overflow: hidden;
}
.backup-file-input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}
.backup-message {
  font-size: 10.5px;
  font-weight: 700;
  margin: 0 0 0 4px;
  color: var(--muted);
}
.backup-message.is-error {
  text-decoration: underline wavy;
}

.dt-footer {
  text-align: center;
  font-size: 11px;
  color: var(--muted);
  padding: 16px 10px 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-weight: 600;
}

@media (max-width: 380px) {
  .two-col { grid-template-columns: 1fr; }
}
